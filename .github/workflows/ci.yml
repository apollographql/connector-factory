name: ci

# The public tree's own checks. This repository is a push-only mirror, so the
# workflow runs on each snapshot pushed to main; pull requests are closed.

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  crate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crate
      - name: Format
        run: cargo fmt --manifest-path crate/Cargo.toml --all --check
      - name: The skill never cites a design document
        # The binary's own strings are the test suite's skill_doc module.
        run: bash graphos-factory-core/scripts/skill-doc-check.sh
      - name: Test
        run: cargo test --manifest-path crate/Cargo.toml --workspace --locked
      - name: Build
        # The graphos-factory binary: the one product src/bin/ holds here.
        run: cargo build --manifest-path crate/Cargo.toml --release --locked -p graphos-factory-targets
      - uses: actions/upload-artifact@v4
        with:
          name: graphos-factory-bin
          path: crate/target/release/graphos-factory
          retention-days: 1

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck
        run: |
          shellcheck --version
          git ls-files -z '*.sh' | xargs -0 --no-run-if-empty shellcheck -x

  # The offline layers on every public pilot: lint clean, validate, reconcile
  # clean, and no hand edit since the applied lock.
  pilots:
    needs: crate
    runs-on: ubuntu-latest
    env:
      # toolchain.sh installs the supergraph plugin only once its Elastic
      # License v2 is accepted. This is Apollo's CI accepting Apollo's own
      # licence; the scripts never set it for a user.
      APOLLO_ELV2_LICENSE: accept
      GRAPHOS_FACTORY_CORE_CACHE: ${{ github.workspace }}/.toolchain-cache
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: graphos-factory-bin
          path: ${{ runner.temp }}/bin
      - name: Install the toolchain
        run: |
          bash graphos-factory-core/scripts/toolchain.sh
          bash graphos-factory-core/scripts/toolchain.sh --check
          echo "$HOME/.rover/bin" >> "$GITHUB_PATH"
      - name: Offline layers
        run: |
          BIN="$RUNNER_TEMP/bin/graphos-factory"
          chmod +x "$BIN"
          found=0
          for p in pilots/graphos/*/; do
            [ -d "$p" ] || continue
            found=1
            p="${p%/}"
            echo "::group::$p"
            "$BIN" lint "$p"
            "$BIN" validate "$p"
            "$BIN" reconcile "$p"
            "$BIN" lock "$p" --check --provenance
            echo "::endgroup::"
          done
          [ "$found" -eq 1 ] || { echo "no pilots under pilots/graphos/" >&2; exit 1; }

  # npx skills and gh skill install skills/graphos-factory/ by copying that
  # directory alone, for any agent (Claude Code, Codex, Cursor, ...). Install
  # it both ways from this checkout and run it from each copy: its own
  # bootstrap.sh --check and env.sh must find the binary this run built, and
  # the copy's scripts must check it against the copy's release.env pin.
  installed-skill:
    needs: crate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: graphos-factory-bin
          path: ${{ runner.temp }}/bin
      - name: Ensure gh skill is available
        run: |
          if ! gh skill --help >/dev/null 2>&1; then
            sudo mkdir -p -m 755 /etc/apt/keyrings
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo tee /etc/apt/keyrings/githubcli-archive-keyring.gpg >/dev/null
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list >/dev/null
            sudo apt-get update -qq
            sudo apt-get install -y -qq gh
          fi
          gh --version | head -1
      - name: The skill passes gh skill's validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh skill publish --dry-run
      - name: Install with gh skill and npx skills
        run: |
          mkdir -p "$RUNNER_TEMP/gh" "$RUNNER_TEMP/npx"
          (cd "$RUNNER_TEMP/gh" && git init -q && gh skill install --from-local "$GITHUB_WORKSPACE" graphos-factory --agent codex --scope project)
          (cd "$RUNNER_TEMP/npx" && npx -y skills@1.4.0 add "$GITHUB_WORKSPACE" --skill graphos-factory --agent codex --yes)
      - name: Run each installed copy
        run: |
          BIN="$RUNNER_TEMP/bin/graphos-factory"
          chmod +x "$BIN"
          for how in gh npx; do
            echo "::group::$how"
            SKILL="$RUNNER_TEMP/$how/.agents/skills/graphos-factory"
            test -f "$SKILL/graphos-factory-core/release.env"
            CACHE="$RUNNER_TEMP/$how-cache"
            mkdir -p "$CACHE/bin"
            cp "$BIN" "$CACHE/bin/graphos-factory"
            ln -s graphos-factory "$CACHE/bin/graphos-factory-core"
            cp -R pilots/graphos/gitea "$RUNNER_TEMP/$how-pilot"
            GRAPHOS_FACTORY_CORE_CACHE="$CACHE" bash "$SKILL/scripts/bootstrap.sh" --check
            # shellcheck disable=SC2016 # expanded by the inner shell
            GRAPHOS_FACTORY_CORE_CACHE="$CACHE" bash -c '
              set -euo pipefail
              . "$1/scripts/env.sh"
              test "$GRAPHOS_FACTORY_CORE_SCRIPTS" = "$1/graphos-factory-core/scripts"
              graphos-factory-core version
              (cd "$2" && graphos-factory lint .)
              . "$GRAPHOS_FACTORY_CORE_SCRIPTS/resolve-bin.sh" 2> "$RUNNER_TEMP/resolve.log"
              cat "$RUNNER_TEMP/resolve.log"
              grep -q "expected >= $(sed -n "s/^version=//p" "$1/graphos-factory-core/release.env")" "$RUNNER_TEMP/resolve.log"
            ' installed "$SKILL" "$RUNNER_TEMP/$how-pilot"
            echo "::endgroup::"
          done
